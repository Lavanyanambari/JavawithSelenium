<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>September Challenge Tracker</title>

<style>
body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #f6f9fc, #e9f3ff);
    margin: 0;
    padding: 30px;
}

.container {
    max-width: 850px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
#dateSelect {
    display: block;
    width: 350px;
    height: 55px;

    margin: 0 auto 25px auto;

    padding: 10px 15px;

    font-size: 22px;
    font-weight: bold;

    border: 2px solid #4CAF50;
    border-radius: 12px;

    background: white;

    box-shadow: 0 3px 8px rgba(0,0,0,0.12);

    cursor: pointer;

    text-align: center;
}
    
.date-label {
     display: block;
    width: 350px;
    height: 55px;

    margin: 0 auto 25px auto;

    padding: 10px 15px;

    font-size: 22px;
    font-weight: bold;

    border: 2px solid #4CAF50;
    border-radius: 12px;

    background: white;

    box-shadow: 0 3px 8px rgba(0,0,0,0.12);

    cursor: pointer;

    text-align: center;

   
}

h1 {
    text-align: center;
    color: #2c3e50;
    margin-bottom: 25px;
}

.date-selector {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: 2px solid #dfe6e9;
    font-size: 16px;
    margin-bottom: 25px;
    cursor: pointer;
}

.task {
    display: flex;
    align-items: center;
    padding: 15px;
    margin-bottom: 12px;
    background: #f8fafc;
    border-left: 5px solid #4CAF50;
    border-radius: 10px;
    transition: all 0.3s ease;
}

.task:hover {
    background: #edf7ed;
    transform: translateX(5px);
}

.task input[type="checkbox"] {
    transform: scale(1.5);
    margin-right: 15px;
    cursor: pointer;
}

.task label {
    font-size: 18px;
    cursor: pointer;
}

.progress-container {
    background: #e0e0e0;
    border-radius: 30px;
    overflow: hidden;
    height: 35px;
    margin-top: 25px;
}

.progress-bar {
    height: 35px;
    width: 0%;
    background: linear-gradient(90deg, #00c853, #4CAF50);
    text-align: center;
    color: white;
    line-height: 35px;
    font-weight: bold;
    transition: width 0.5s ease;
}

.summary {
    margin-top: 20px;
    background: #eef7ff;
    padding: 20px;
    border-radius: 12px;
    border-left: 5px solid #2196F3;
}

.summary h3 {
    margin-top: 0;
}

#status {
    font-size: 22px;
    font-weight: bold;
    color: #2c3e50;
}

table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    overflow: hidden;
    border-radius: 10px;
}

th {
    background: #4CAF50;
    color: white;
    padding: 12px;
}

td {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

tr:nth-child(even) {
    background: #f8fafc;
}

tr:hover {
    background: #edf7ed;
}
</style>

</head>
<body>

<div class="container">

<h1>🏆 September Challenge Tracker</h1>

<div class="date-container">
    <label class="date-label">📅 Select Day</label>
    <select id="dateSelect"></select>
</div>


<div id="taskList"></div>

<div class="progress-container">
    <div class="progress-bar" id="progressBar">0%</div>
</div>

<h3 id="status">0/10 Completed</h3>


</div>
<h2>Monthly Overview</h2>

<div style="margin-bottom:15px;">
    <b>Monthly Average:</b> <span id="avgCompletion">0%</span><br>
    <b>Best Day:</b> <span id="bestDay">N/A</span><br>
    <b>Total Habits Completed:</b> <span id="totalCompleted">0</span>
</div>

<table border="1" width="100%" cellpadding="8" cellspacing="0">
    <thead>
        <tr style="background:#4CAF50;color:white;">
            <th>Date</th>
            <th>% Complete</th>
            <th>Completed</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody id="monthlyOverview"></tbody>
</table>

<script>

const habits = [
"Suryanamaskar 6 Sets",
"Water 4 liters",
"No Sugar",
"5K Steps Daily",
"Exercise for 40min",
"No Social Media before 9am",
"Listen 2 Favorite Songs",
"Learn 1 new item to cook/theory",    
"Study / Practice 2 Hours",
"8 Hours Sleep"
];

const dateSelect = document.getElementById("dateSelect");
const taskList = document.getElementById("taskList");

for(let i=1;i<=30;i++){
    let option=document.createElement("option");
    option.value="sep"+i;
    option.textContent="September "+i;
    dateSelect.appendChild(option);
}

function loadTasks(){

    const key=dateSelect.value;
    const saved=JSON.parse(localStorage.getItem(key))
        || new Array(habits.length).fill(false);

    taskList.innerHTML="";

    habits.forEach((habit,index)=>{

        const div=document.createElement("div");
        div.className="task";

        const checkbox=document.createElement("input");
        checkbox.type="checkbox";
        checkbox.checked=saved[index];

        checkbox.addEventListener("change",()=>{

            saved[index]=checkbox.checked;
            localStorage.setItem(key,JSON.stringify(saved));

            updateProgress(saved);
        });

        div.appendChild(checkbox);
        div.appendChild(document.createTextNode(habit));

        taskList.appendChild(div);
    });

   updateProgress(saved);
   loadMonthlyOverview();
}

function updateProgress(data){

    const completed=data.filter(x=>x).length;

    const percent=Math.round(
        completed/habits.length*100
    );

    document.getElementById("progressBar").style.width=
        percent+"%";

    document.getElementById("progressBar").innerHTML=
        percent+"%";

    document.getElementById("status").innerHTML=
        completed+"/10 Completed";
}

dateSelect.addEventListener("change",loadTasks);

dateSelect.selectedIndex=0;

loadTasks();

function loadMonthlyOverview() {

    let tbody = document.getElementById("monthlyOverview");
    tbody.innerHTML = "";

    let totalPercent = 0;
    let totalCompleted = 0;
    let bestPercent = 0;
    let bestDay = "N/A";

    for(let i=1;i<=30;i++){

        const key = "sep" + i;

        const data =
            JSON.parse(localStorage.getItem(key))
            || new Array(habits.length).fill(false);

        const completed =
            data.filter(x => x).length;

        const percent =
            Math.round((completed / habits.length) * 100);

        totalPercent += percent;
        totalCompleted += completed;

        if(percent > bestPercent){
            bestPercent = percent;
            bestDay = "Sep " + i;
        }

        let status = "❌";
        if(percent >= 100) status = "🏆";
        else if(percent >= 80) status = "✅";
        else if(percent >= 50) status = "🟡";

        tbody.innerHTML += `
        <tr>
            <td>Sep ${i}</td>
            <td>${percent}%</td>
            <td>${completed}/10</td>
            <td>${status}</td>
        </tr>`;
    }

    document.getElementById("avgCompletion").innerText =
        Math.round(totalPercent / 30) + "%";

    document.getElementById("bestDay").innerText =
        bestDay + " (" + bestPercent + "%)";

    document.getElementById("totalCompleted").innerText =
        totalCompleted;
}

</script>

</body>
</html>
